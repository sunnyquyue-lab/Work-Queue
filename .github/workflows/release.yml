# Builds the Work Queue installer on GitHub's Windows machines and publishes it
# as a GitHub Release. Installed copies of Work Queue check these releases and
# update themselves.
#
# To release: Actions tab -> "Build and publish Work Queue" -> Run workflow,
# then type a version number higher than the last one (for example 2.1.1).
#
# The build tool is told not to publish; this workflow publishes instead, one
# file at a time. The release starts as a draft and only goes public once the
# installer, its blockmap and latest.yml (the file installed copies check) are
# all attached, so an update can never be half-published. Re-running with the
# same version finishes a release that an earlier run left incomplete.
name: Build and publish Work Queue

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, higher than the last release (for example 2.1.1)"
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Set the version number
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Point automatic updates at this repository
        run: |
          npm pkg set build.publish.provider=github
          npm pkg set build.publish.owner="${{ github.repository_owner }}"
          npm pkg set build.publish.repo="${{ github.event.repository.name }}"
          npm pkg set build.publish.releaseType=release

      - name: Build the installer (without publishing)
        run: npx electron-builder --win --publish never

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          EXE="dist/Work-Queue-Setup-$VERSION.exe"
          MAP="$EXE.blockmap"
          YML="dist/latest.yml"
          for f in "$EXE" "$MAP" "$YML"; do
            [ -f "$f" ] || { echo "Missing $f - nothing was published."; exit 1; }
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (probably from an earlier run). Finishing it."
            gh release edit "$TAG" --draft=true
            gh release upload "$TAG" "$EXE" "$MAP" --clobber
          else
            gh release create "$TAG" "$EXE" "$MAP" --draft --title "Work Queue $VERSION" \
              --notes "Work Queue $VERSION. Installed copies update themselves." --target "$GITHUB_SHA"
          fi
          # latest.yml last: installed copies only notice the update once everything else is there
          gh release upload "$TAG" "$YML" --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG with $(basename "$EXE"), its blockmap and latest.yml."
