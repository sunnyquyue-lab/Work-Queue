name: Build and publish Work Queue

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, higher than the last release (for example 2.0.1)"
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Set the version number
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Point automatic updates at this repository
        run: |
          npm pkg set build.publish.provider=github
          npm pkg set build.publish.owner="${{ github.repository_owner }}"
          npm pkg set build.publish.repo="${{ github.event.repository.name }}"
          npm pkg set build.publish.releaseType=release

      - name: Build the installer and publish the release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
